# Checks only: no secrets, nothing is published from here (releases are built and signed on the release PC).
name: check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4 # the dev PC's Node
          cache: npm
      - run: npm ci
      # better-sqlite3 for Electron 22 (the tests spawn the keeper as Electron-as-node). `npm ci` runs it too;
      # the explicit step is the card's and costs a minute (HANDOFF 1.5: a fresh install once left the wrong build).
      - run: npm run postinstall
      # `npm run check` step by step, in its order, WITHOUT its last step (`npm run test:electron`, the real-Electron print test):
      # Electron 22 cannot load any page on GitHub's Windows Server 2025 runner (every load fails with ERR_FAILED -2, cause never found),
      # so that step is red there whatever the code does. It still runs in `npm run check` on the dev PC, which is its proof.
      # If the `check` script in package.json changes, change this list with it.
      - run: npm run typecheck
      - run: npx eslint . --max-warnings 0
      - run: npm run clean:node
      - run: npm run build:node
      - run: node --test
        working-directory: dist-electron
      - run: npm run test:db
      - run: npm run dist
